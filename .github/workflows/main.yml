name: Cloud Video Render Pipeline

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Video Generation
        run: node index.js

      - name: Upload Final Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Final-Rendered-Video
          path: final_video.mp4
