<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>AI Video Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background: #1e293b; padding: 30px; border-radius: 12px; }
        input, button { width: 100%; padding: 12px; margin-bottom: 15px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { background: #0ea5e9; font-weight: bold; cursor: pointer; }
        .scene-card { background: #334155; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .prompt { color: #38bdf8; font-family: monospace; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Video Generation Studio</h1>
        <input type="text" id="groqKey" placeholder="Enter Groq API Key">
        <input type="file" id="audioFile" accept="audio/*">
        <button onclick="analyze()">Analyze Audio & Get Prompts</button>

        <div id="scenesSection"></div>
        <button id="renderBtn" style="display:none; background: #22c55e;" onclick="renderVideo()">Render Final Video</button>
        <div id="result"></div>
    </div>

    <script>
        let totalScenes = 0;

        async function analyze() {
            const apiKey = document.getElementById('groqKey').value;
            const audioFile = document.getElementById('audioFile').files[0];
            const formData = new FormData();
            formData.append('apiKey', apiKey);
            formData.append('audio', audioFile);

            document.getElementById('scenesSection').innerHTML = 'Analyzing... Please wait.';

            const res = await axios.post('/api/analyze', formData);
            const scenes = res.data.scenes;
            totalScenes = scenes.length;

            let html = '<h2>Generated Prompts & Upload Images</h2>';
            scenes.forEach(s => {
                html += `
                    <div class="scene-card">
                        <h3>Scene ${s.scene} (${s.start.toFixed(1)}s - ${s.end.toFixed(1)}s)</h3>
                        <div class="prompt">${s.prompt}</div>
                        <label>Upload Image for Scene ${s.scene}:</label>
                        <input type="file" id="img_${s.scene}" accept="image/*">
                    </div>
                `;
            });

            document.getElementById('scenesSection').innerHTML = html;
            document.getElementById('renderBtn').style.display = 'block';
        }

        async function renderVideo() {
            const formData = new FormData();
            for (let i = 1; i <= totalScenes; i++) {
                const fileInput = document.getElementById(`img_${i}`).files[0];
                if (fileInput) {
                    const autoNamedFile = new File([fileInput], `image_${String(i).padStart(3, '0')}.jpg`, { type: fileInput.type });
                    formData.append('images', autoNamedFile);
                }
            }

            document.getElementById('result').innerHTML = 'Rendering video with FFmpeg... Please wait.';
            const res = await axios.post('/api/render', formData);
            
            if (res.data.success) {
                document.getElementById('result').innerHTML = `<a href="${res.data.downloadUrl}" download="final_video.mp4" style="color: #38bdf8; font-size: 18px; font-weight: bold;">Download Final Video (MP4)</a>`;
            }
        }
    </script>
</body>
</html>
