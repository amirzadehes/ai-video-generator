<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud AI Video Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 25px; }
        .step-box { background: #334155; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #94a3b8; }
        input[type="text"], input[type="file"] { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; box-sizing: border-box; margin-bottom: 15px; }
        button { background: #0ea5e9; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background: #0284c7; }
        .scene-card { background: #1e293b; border: 1px solid #475569; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .prompt-text { background: #0f172a; padding: 10px; border-radius: 4px; color: #38bdf8; font-family: monospace; word-break: break-all; margin-bottom: 10px; }
        #loading, #scenesSection { display: none; }
        .render-btn { background: #22c55e; margin-top: 20px; }
        .render-btn:hover { background: #16a34a; }
        #statusBox { margin-top: 15px; padding: 15px; background: #0f172a; border-radius: 6px; display: none; font-family: monospace; color: #38bdf8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cloud AI Video Studio</h1>
        
        <div class="step-box">
            <label for="groqKey">Groq API Key:</label>
            <input type="text" id="groqKey" placeholder="gsk_..." onchange="saveConfig()">
            
            <label for="githubToken">GitHub Personal Access Token:</label>
            <input type="text" id="githubToken" placeholder="ghp_..." onchange="saveConfig()">
            
            <label for="repoOwner">GitHub Username:</label>
            <input type="text" id="repoOwner" placeholder="username" onchange="saveConfig()">
            
            <label for="repoName">Repository Name:</label>
            <input type="text" id="repoName" placeholder="repository-name" onchange="saveConfig()">

            <label for="audioFile">Select Audio File (MP3):</label>
            <input type="file" id="audioFile" accept="audio/*">
            
            <button onclick="analyzeAudio()">Analyze Audio & Generate Prompts</button>
        </div>

        <div id="loading" style="text-align: center; color: #38bdf8; font-weight: bold; margin: 15px 0;">Analyzing audio and extracting scenes via AI... Please wait.</div>
        
        <div id="scenesSection">
            <div id="scenesContainer"></div>
            <button class="render-btn" onclick="startFullPipeline()">Build & Render Final Video</button>
        </div>

        <div id="statusBox"></div>
    </div>

    <script>
        const IMAGE_STYLE = "Modern editorial graphic novel illustration";
        let detectedChunks = [];

        window.onload = function() {
            if(localStorage.getItem('groqKey')) document.getElementById('groqKey').value = localStorage.getItem('groqKey');
            if(localStorage.getItem('githubToken')) document.getElementById('githubToken').value = localStorage.getItem('githubToken');
            if(localStorage.getItem('repoOwner')) document.getElementById('repoOwner').value = localStorage.getItem('repoOwner');
            if(localStorage.getItem('repoName')) document.getElementById('repoName').value = localStorage.getItem('repoName');
        }

        function saveConfig() {
            localStorage.setItem('groqKey', document.getElementById('groqKey').value.trim());
            localStorage.setItem('githubToken', document.getElementById('githubToken').value.trim());
            localStorage.setItem('repoOwner', document.getElementById('repoOwner').value.trim());
            localStorage.setItem('repoName', document.getElementById('repoName').value.trim());
        }

        async function analyzeAudio() {
            saveConfig();
            const apiKey = document.getElementById('groqKey').value.trim();
            const fileInput = document.getElementById('audioFile').files[0];
            
            if (!apiKey || !fileInput) {
                alert('Please enter your Groq API Key and select an audio file.');
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('scenesSection').style.display = 'none';

            const formData = new FormData();
            formData.append('file', fileInput);
            formData.append('model', 'whisper-large-v3');
            formData.append('response_format', 'verbose_json');

            try {
                const transcriptionRes = await axios.post('https://api.groq.com/openai/v1/audio/transcriptions', formData, {
                    headers: { 'Authorization': `Bearer ${apiKey}` }
                });

                const segments = transcriptionRes.data.segments;
                detectedChunks = [];
                let currentText = '';
                let chunkStart = segments[0].start;
                let chunkEnd = segments[0].end;
                const targetDuration = 30;

                segments.forEach((seg) => {
                    currentText += ' ' + seg.text;
                    chunkEnd = seg.end;
                    if ((chunkEnd - chunkStart) >= targetDuration) {
                        detectedChunks.push({ start: chunkStart, end: chunkEnd, text: currentText.trim() });
                        currentText = '';
                        chunkStart = seg.end;
                    }
                });
                if (currentText.trim().length > 0) {
                    detectedChunks.push({ start: chunkStart, end: chunkEnd, text: currentText.trim() });
                }

                let htmlContent = '<h2>Extracted Scenes & Prompts</h2>';
                for (let i = 0; i < detectedChunks.length; i++) {
                    const chunk = detectedChunks[i];
                    const sceneIndex = i + 1;
                    
                    const promptRes = await axios.post('https://api.groq.com/openai/v1/chat/completions', {
                        model: "openai/gpt-oss-20b",
                        messages: [{ role: "user", content: `Write a short English image prompt based on this text: "${chunk.text}". Style: ${IMAGE_STYLE}. Reply ONLY with the prompt.` }]
                    }, {
                        headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' }
                    });

                    chunk.prompt = promptRes.data.choices[0].message.content.trim();
                    
                    htmlContent += `
                        <div class="scene-card">
                            <h3>Scene ${sceneIndex} (${chunk.start.toFixed(1)}s - ${chunk.end.toFixed(1)}s)</h3>
                            <div class="prompt-text">${chunk.prompt}</div>
                            <label>Upload Image for Scene ${sceneIndex} (Will be auto-named):</label>
                            <input type="file" id="imageInput_${i}" accept="image/*">
                        </div>
                    `;
                }

                document.getElementById('scenesContainer').innerHTML = htmlContent;
                document.getElementById('scenesSection').style.display = 'block';
            } catch (error) {
                alert('Error during processing: ' + (error.response?.data?.error?.message || error.message));
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        async function startFullPipeline() {
            const token = document.getElementById('githubToken').value.trim();
            const owner = document.getElementById('repoOwner').value.trim();
            const repo = document.getElementById('repoName').value.trim();
            const audioFile = document.getElementById('audioFile').files[0];

            if (!token || !owner || !repo || !audioFile) {
                alert('Please ensure all GitHub configurations and audio file are provided.');
                return;
            }

            const statusBox = document.getElementById('statusBox');
            statusBox.style.display = 'block';
            statusBox.innerHTML = 'Step 1/3: Auto-renaming & uploading assets to GitHub...';

            const headers = {
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28'
            };

            try {
                const audioBase64 = await fileToBase64(audioFile);
                await axios.put(`https://api.github.com/repos/${owner}/${repo}/contents/test-audio.mp3`, {
                    message: 'Upload audio file via web studio',
                    content: audioBase64
                }, { headers });

                let ffmpegInput = '';
                for (let i = 0; i < detectedChunks.length; i++) {
                    const fileInput = document.getElementById(`imageInput_${i}`).files[0];
                    const sceneIndex = i + 1;
                    const imageName = `image_${String(sceneIndex).padStart(3, '0')}.jpg`;
                    const duration = (detectedChunks[i].end - detectedChunks[i].start).toFixed(2);

                    if (fileInput) {
                        const imgBase64 = await fileToBase64(fileInput);
                        await axios.put(`https://api.github.com/repos/${owner}/${repo}/contents/images/${imageName}`, {
                            message: `Auto-name and upload ${imageName}`,
                            content: imgBase64
                        }, { headers });
                    }

                    ffmpegInput += `file 'images/${imageName}'\n`;
                    ffmpegInput += `duration ${duration}\n`;
                }

                const inputTxtBase64 = btoa(unescape(encodeURIComponent(ffmpegInput)));
                await axios.put(`https://api.github.com/repos/${owner}/${repo}/contents/input.txt`, {
                    message: 'Update ffmpeg input configuration',
                    content: inputTxtBase64
                }, { headers });

                statusBox.innerHTML = 'Step 2/3: Triggering automated video render...';

                await axios.post(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/main.yml/dispatches`, {
                    ref: 'main'
                }, { headers });

                statusBox.innerHTML = 'Step 3/3: Video is rendering in the background! Wait 1-2 minutes and download your final video from GitHub Actions.';

            } catch (error) {
                statusBox.innerHTML = 'Error: ' + (error.response?.data?.message || error.message);
            }
        }
    </script>
</body>
</html>
