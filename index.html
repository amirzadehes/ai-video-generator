<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud AI Video Studio Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1100px; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 25px; }
        .step-box { background: #334155; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #94a3b8; }
        input[type="text"], input[type="file"] { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; box-sizing: border-box; margin-bottom: 15px; }
        .time-inputs { display: flex; gap: 10px; margin-bottom: 15px; }
        .time-inputs div { flex: 1; }
        button { background: #0ea5e9; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background: #0284c7; }
        .scene-card { background: #1e293b; border: 1px solid #475569; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .options-row { display: flex; gap: 12px; flex-wrap: wrap; }
        .options-row > div { flex: 1; min-width: 180px; }
        select { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; box-sizing: border-box; margin-bottom: 0; }
        .options-row input[type="text"] { margin-bottom: 0; }
        .scenes-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        @media (max-width: 800px) { .scenes-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 520px) { .scenes-grid { grid-template-columns: 1fr; } }
        .scene-card { display: flex; flex-direction: column; margin-bottom: 0; padding: 12px; min-width: 0; }
        .scene-card h3 { margin: 0 0 10px 0; font-size: 14px; line-height: 1.7; flex: 1; }
        .scene-actions { display: flex; gap: 6px; margin-bottom: 10px; }
        .scene-actions button { width: auto; flex: 1; padding: 8px 4px; font-size: 13px; }
        .copy-btn { background: #8b5cf6; }
        .copy-btn:hover { background: #7c3aed; }
        .scene-inputs { display: flex; gap: 6px; align-items: center; }
        .scene-inputs input { margin-bottom: 0; padding: 6px; font-size: 12px; min-width: 0; }
        .scene-inputs input[type="file"] { flex: 2; }
        .scene-inputs input[type="text"] { flex: 1; text-align: center; }
        #loading, #scenesSection { display: none; }
        .render-btn { background: #22c55e; margin-top: 20px; }
        .render-btn:hover { background: #16a34a; }
        #statusBox { margin-top: 15px; padding: 15px; background: #0f172a; border-radius: 6px; display: none; font-family: monospace; color: #38bdf8; text-align: center; }
        .progress-bar-container { width: 100%; background: #334155; border-radius: 6px; margin-top: 10px; overflow: hidden; display: none; }
        .progress-bar { width: 0%; height: 20px; background: #22c55e; text-align: center; color: white; font-size: 12px; line-height: 20px; transition: width 0.5s; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cloud AI Video Studio Pro</h1>

        <div class="step-box">
            <details id="configDetails">
                <summary style="cursor: pointer; font-weight: bold; color: #38bdf8; margin-bottom: 15px;">تنظیمات پایه‌ای (ذخیره‌شده)</summary>
                <label for="groqKey">Groq API Key:</label>
                <input type="text" id="groqKey" placeholder="gsk_..." onchange="saveConfig()">

                <label for="githubToken">GitHub Personal Access Token:</label>
                <input type="text" id="githubToken" placeholder="ghp_..." onchange="saveConfig()">

                <label for="repoOwner">GitHub Username:</label>
                <input type="text" id="repoOwner" placeholder="username" onchange="saveConfig()">

                <label for="repoName">Repository Name:</label>
                <input type="text" id="repoName" placeholder="repository-name" onchange="saveConfig()">
            </details>

            <hr style="border: 0; border-top: 1px solid #475569; margin: 20px 0;">

            <label for="videoSize">اندازه و نوع ویدیو (قبل از تحلیل انتخاب کنید):</label>
            <select id="videoSize" style="margin-bottom: 15px;">
                <option value="1920x1080" data-desc="horizontal 16:9 landscape (YouTube)" selected>افقی 16:9 — یوتیوب (1920×1080)</option>
                <option value="1080x1920" data-desc="vertical 9:16 portrait (Instagram Reels and Stories)">عمودی 9:16 — اینستاگرام ریلز/استوری (1080×1920)</option>
                <option value="1080x1350" data-desc="vertical 4:5 portrait (Instagram feed)">عمودی 4:5 — پست اینستاگرام (1080×1350)</option>
                <option value="1080x1080" data-desc="square 1:1">مربع 1:1 (1080×1080)</option>
            </select>

            <label for="audioFile">انتخاب فایل صوتی (MP3):</label>
            <input type="file" id="audioFile" accept="audio/*">

            <button onclick="analyzeAudio()">تحلیل هوشمند صوت و تولید صحنه‌ها</button>
        </div>

        <div id="loading" style="text-align: center; color: #38bdf8; font-weight: bold; margin: 15px 0;">در حال راه‌اندازی...</div>

        <div id="scenesSection">
            <div id="scenesContainer"></div>
            <div class="step-box" style="margin-top: 20px;">
                <div class="options-row">
                    <div>
                        <label for="transitionType">افکت انتقال بین عکس‌ها:</label>
                        <select id="transitionType">
                            <option value="slideleft" selected>لغزش به چپ (شبیه ورق زدن)</option>
                            <option value="slideright">لغزش به راست</option>
                            <option value="slideup">لغزش به بالا</option>
                            <option value="slidedown">لغزش به پایین</option>
                            <option value="smoothleft">پاک‌شدن نرم به چپ</option>
                            <option value="smoothright">پاک‌شدن نرم به راست</option>
                            <option value="wipeleft">پرده به چپ</option>
                            <option value="wiperight">پرده به راست</option>
                            <option value="fade">محو شدن</option>
                            <option value="fadeblack">محو از طریق سیاه</option>
                            <option value="dissolve">حل شدن</option>
                            <option value="circleopen">دایره‌ی بازشونده</option>
                            <option value="circleclose">دایره‌ی بسته‌شونده</option>
                            <option value="radial">چرخشی</option>
                            <option value="pixelize">پیکسلی</option>
                            <option value="random">تصادفی (ترکیبی)</option>
                            <option value="none">بدون افکت (برش مستقیم)</option>
                        </select>
                    </div>
                    <div>
                        <label for="transitionDuration">مدت انتقال (ثانیه):</label>
                        <input type="text" id="transitionDuration" value="0.8">
                    </div>
                </div>
            </div>
            <button class="render-btn" onclick="startFullPipeline()">آپلود عکس‌ها و ساخت نهایی ویدیو</button>
        </div>

        <div id="statusBox">
            <div id="statusText">در حال آماده‌سازی...</div>
            <div class="progress-bar-container" id="progressBarContainer">
                <div class="progress-bar" id="progressBar">0%</div>
            </div>
        </div>
    </div>

    <script>
        const IMAGE_STYLE = "Modern editorial graphic novel illustration, full-screen, borderless, edge-to-edge, zero text, no text boxes, no captions, no borders";

        // مدل چت Groq: اگر در آینده منسوخ شد، فقط همین یک خط را عوض کنید
        const GROQ_CHAT_MODEL = "openai/gpt-oss-120b";

        let manualScenes = [];

        window.onload = function() {
            if(localStorage.getItem('groqKey')) document.getElementById('groqKey').value = localStorage.getItem('groqKey');
            if(localStorage.getItem('githubToken')) document.getElementById('githubToken').value = localStorage.getItem('githubToken');
            if(localStorage.getItem('repoOwner')) document.getElementById('repoOwner').value = localStorage.getItem('repoOwner');
            if(localStorage.getItem('repoName')) document.getElementById('repoName').value = localStorage.getItem('repoName');

            if(localStorage.getItem('groqKey') && localStorage.getItem('githubToken')) {
                document.getElementById('configDetails').open = false;
            } else {
                document.getElementById('configDetails').open = true;
            }
        }

        function saveConfig() {
            localStorage.setItem('groqKey', document.getElementById('groqKey').value.trim());
            localStorage.setItem('githubToken', document.getElementById('githubToken').value.trim());
            localStorage.setItem('repoOwner', document.getElementById('repoOwner').value.trim());
            localStorage.setItem('repoName', document.getElementById('repoName').value.trim());
        }

        function secondsToMMSS(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function mmssToSeconds(str) {
            const parts = str.split(':');
            if(parts.length !== 2) return 0;
            return parseInt(parts[0]) * 60 + parseInt(parts[1]);
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        async function analyzeAudio() {
            saveConfig();
            const apiKey = document.getElementById('groqKey').value.trim();
            const fileInput = document.getElementById('audioFile').files[0];

            if (!apiKey || !fileInput) {
                alert('لطفاً کلید Groq API و فایل صوتی را وارد/انتخاب کنید.');
                return;
            }

            const loadingEl = document.getElementById('loading');
            loadingEl.style.display = 'block';
            loadingEl.innerHTML = 'مرحله ۱: استخراج متن از فایل صوتی (Whisper)...';
            document.getElementById('scenesSection').style.display = 'none';

            const formData = new FormData();
            formData.append('file', fileInput);
            formData.append('model', 'whisper-large-v3');
            formData.append('response_format', 'verbose_json');

            try {
                const transcriptionRes = await axios.post('https://api.groq.com/openai/v1/audio/transcriptions', formData, {
                    headers: { 'Authorization': `Bearer ${apiKey}` }
                });

                const segments = transcriptionRes.data.segments;

                loadingEl.innerHTML = 'مرحله ۲: تحلیل هوشمند موضوعات و جداسازی صحنه‌ها بر اساس تغییر محتوا...';

                const transcriptContext = segments.map(s => `[${s.start.toFixed(1)}s - ${s.end.toFixed(1)}s] ${s.text.trim()}`).join('\n');

                const frameDesc = document.getElementById('videoSize').selectedOptions[0].dataset.desc;

                const systemPrompt = `You are a video director. Analyze the following transcript and split it into video scenes.

SCENE SPLITTING RULES:
- Create a NEW scene ONLY when the topic changes or a genuinely new piece of information, idea, or subject is introduced.
- Do NOT create a scene per sentence or per time interval. Keep the number of scenes as low as the content allows. A scene may be long (a minute or more) if it stays on the same topic.
- Scenes must cover the whole transcript without gaps, using exact start and end times in seconds.

Return a valid JSON object containing a "scenes" array. Each object in the array must have:
"start": (number) exact start time of the scene in seconds,
"end": (number) exact end time of the scene in seconds,
"description": (string) a short one-sentence description of what this scene is about, written in the same language as the transcript,
"prompt": (string) a vivid, cinematic, atmospheric English image-generation prompt of 80 to 120 words, written as ONE flowing description made of comma-separated clauses, in the same spirit as the three examples below. It must have emotional, dramatic mood (mystery, tension, danger, wonder, curiosity), a clear focal subject that is doing or showing something, a concrete setting (place, era, environment), secondary figures or symbolic objects, background details that tell the story, a specific color palette with contrast between warm and cool tones, atmospheric effects (haze, glow, smoke, light beams), and camera or composition cues (angle, lens, focus, centered subject). Make it expressive and alive, never flat, static, generic or bland. Never ask for readable text, but you may hint at things like newspaper headlines or labels as visual shapes. Compose the image for a ${frameDesc} frame. End the prompt with this exact style: "${IMAGE_STYLE}"

Examples of the expected prompt quality (shown without the final style sentence):
Example 1: An elegant 3D rendering of a malformed protein chain floating in a dark void, its geometric folds highlighted in neon cyan, a label-like aura indicating a prion without text, background filled with faint molecular diagrams, cool dark palette with bright accents, camera rotates slowly around the protein, focus on the irregular shape, sense of mystery and scientific intrigue
Example 2: A dimly lit urban kitchen in 1980s London, a sizzling burger on a grill emitting an invisible greenish gas, a shadowy figure in a lab coat watches with a concerned expression, background shows vintage newspaper headlines about mysterious illnesses, soft focus on the gas swirling, cool blue and sickly green color palette, atmospheric haze suggesting danger, composition centered on the burger with the gas forming a subtle halo, low angle shot emphasizing the ominous presence
Example 3: Close-up of a microscopic view of a prion particle glowing amber inside a stylized stomach cavity, flames and acid droplets bounce off it without effect, a stylized immune cell reaches out confused, background is a dark laboratory with glowing monitors, high contrast warm and cold tones, composition shows the prion in the center with protective aura, macro lens perspective

Return ONLY the raw JSON object, with no markdown and no explanation. Do not use double-quote characters inside any string value.

Transcript:
${transcriptContext}`;

                let aiData = null;
                let lastError = null;
                for (let attempt = 1; attempt <= 3 && !aiData; attempt++) {
                    try {
                        const promptRes = await axios.post('https://api.groq.com/openai/v1/chat/completions', {
                            model: GROQ_CHAT_MODEL,
                            messages: [{ role: "user", content: systemPrompt }],
                            reasoning_effort: "low",
                            max_completion_tokens: 16000
                        }, {
                            headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' }
                        });

                        const raw = promptRes.data.choices[0].message.content || '';
                        const jsonText = raw.slice(raw.indexOf('{'), raw.lastIndexOf('}') + 1);
                        const parsed = JSON.parse(jsonText);
                        if (!parsed.scenes || !parsed.scenes.length) throw new Error('هیچ صحنه‌ای تولید نشد');
                        aiData = parsed;
                    } catch (e) {
                        lastError = e;
                        loadingEl.innerHTML = `مرحله ۲: تلاش مجدد (${attempt}/3)...`;
                    }
                }
                if (!aiData) throw lastError;

                manualScenes = aiData.scenes.map(s => ({
                    start: parseFloat(s.start) || 0,
                    end: parseFloat(s.end) || 0,
                    description: s.description || '',
                    prompt: s.prompt
                }));

                renderScenesUI();
                document.getElementById('scenesSection').style.display = 'block';
            } catch (error) {
                alert('خطا در پردازش: ' + (error.response?.data?.error?.message || error.message));
            } finally {
                loadingEl.style.display = 'none';
            }
        }

        function renderScenesUI() {
            let htmlContent = '<h2>مدیریت هوشمند صحنه‌ها</h2><div class="scenes-grid">';
            for (let i = 0; i < manualScenes.length; i++) {
                const s = manualScenes[i];
                htmlContent += `
                    <div class="scene-card" id="sceneCard_${i}">
                        <h3>${escapeHtml(s.description) || 'صحنه جدید'}</h3>
                        <div class="scene-actions">
                            <button class="copy-btn" id="copyBtn_${i}" onclick="copyPrompt(${i})" title="کپی پرامپت تولید عکس">📋 پرامپت</button>
                            <button style="background: #10b981;" onclick="addSceneBelow(${i})" title="افزودن صحنه جدید در زیر این صحنه">➕ صحنه</button>
                            <button style="background: #ef4444;" onclick="removeScene(${i})" title="حذف این صحنه">🗑 حذف</button>
                        </div>
                        <div class="scene-inputs">
                            <input type="file" id="imageInput_${i}" accept="image/*" title="آپلود عکس">
                            <input type="text" id="start_${i}" value="${secondsToMMSS(s.start)}" onchange="updateTime(${i})" title="شروع (مثلاً 1:24)" placeholder="شروع">
                            <input type="text" id="end_${i}" value="${secondsToMMSS(s.end)}" onchange="updateTime(${i})" title="پایان (مثلاً 1:45)" placeholder="پایان">
                        </div>
                    </div>
                `;
            }
            htmlContent += '</div>';
            document.getElementById('scenesContainer').innerHTML = htmlContent;
        }

        async function copyPrompt(i) {
            const text = manualScenes[i].prompt || '';
            try {
                await navigator.clipboard.writeText(text);
            } catch (e) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            }
            const btn = document.getElementById(`copyBtn_${i}`);
            if (btn) {
                btn.innerHTML = '✅ کپی شد';
                setTimeout(() => { btn.innerHTML = '📋 پرامپت'; }, 1500);
            }
        }

        function updateTime(i) {
            const startStr = document.getElementById(`start_${i}`).value;
            const endStr = document.getElementById(`end_${i}`).value;
            manualScenes[i].start = mmssToSeconds(startStr);
            manualScenes[i].end = mmssToSeconds(endStr);
        }

        function addSceneBelow(i) {
            const currentEnd = manualScenes[i].end;
            manualScenes.splice(i + 1, 0, {
                start: currentEnd,
                end: currentEnd + 30,
                description: 'صحنه جدید',
                prompt: IMAGE_STYLE + ", custom scene"
            });
            renderScenesUI();
        }

        function removeScene(i) {
            manualScenes.splice(i, 1);
            renderScenesUI();
        }

        async function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        async function uploadFileToGitHub(owner, repo, filePath, contentBase64, message, headers) {
            let sha = undefined;
            try {
                const existing = await axios.get(`https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`, { headers });
                if (existing.data && existing.data.sha) sha = existing.data.sha;
            } catch (e) {}

            const payload = { message: message, content: contentBase64 };
            if (sha) payload.sha = sha;
            await axios.put(`https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`, payload, { headers });
        }

        async function startFullPipeline() {
            const token = document.getElementById('githubToken').value.trim();
            const owner = document.getElementById('repoOwner').value.trim();
            const repo = document.getElementById('repoName').value.trim();
            const audioFile = document.getElementById('audioFile').files[0];

            if (!token || !owner || !repo || !audioFile) {
                alert('لطفاً تنظیمات گیت‌هاب و فایل صوتی را بررسی کنید.');
                return;
            }

            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');
            const progressBarContainer = document.getElementById('progressBarContainer');
            const progressBar = document.getElementById('progressBar');

            statusBox.style.display = 'block';
            progressBarContainer.style.display = 'block';
            statusText.innerHTML = 'در حال آپلود فایل‌ها و عکس‌های تنظیم‌شده به گیت‌هاب...';
            progressBar.style.width = '20%';
            progressBar.innerHTML = '20%';

            const headers = {
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28'
            };

            try {
                const audioBase64 = await fileToBase64(audioFile);
                await uploadFileToGitHub(owner, repo, 'test-audio.mp3', audioBase64, 'Upload audio file', headers);

                let ffmpegInput = '';
                for (let i = 0; i < manualScenes.length; i++) {
                    const fileInput = document.getElementById(`imageInput_${i}`).files[0];
                    const sceneIndex = i + 1;
                    const imageName = `image_${String(sceneIndex).padStart(3, '0')}.jpg`;

                    const startSec = manualScenes[i].start;
                    const endSec = manualScenes[i].end;
                    const duration = Math.max(1, endSec - startSec).toFixed(2);

                    if (fileInput) {
                        const imgBase64 = await fileToBase64(fileInput);
                        await uploadFileToGitHub(owner, repo, `images/${imageName}`, imgBase64, `Upload ${imageName}`, headers);
                    }

                    ffmpegInput += `file 'images/${imageName}'\n`;
                    ffmpegInput += `duration ${duration}\n`;
                }

                const inputTxtBase64 = btoa(unescape(encodeURIComponent(ffmpegInput)));
                await uploadFileToGitHub(owner, repo, 'input.txt', inputTxtBase64, 'Update input.txt', headers);

                const [vw, vh] = document.getElementById('videoSize').value.split('x').map(Number);
                const configObj = {
                    transition: document.getElementById('transitionType').value,
                    transitionDuration: parseFloat(document.getElementById('transitionDuration').value) || 0.8,
                    width: vw,
                    height: vh
                };
                const configBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(configObj))));
                await uploadFileToGitHub(owner, repo, 'config.json', configBase64, 'Update config.json', headers);

                progressBar.style.width = '50%';
                progressBar.innerHTML = '50%';
                statusText.innerHTML = 'در حال راه‌اندازی موتور رندر ابری...';

                await axios.post(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/main.yml/dispatches`, {
                    ref: 'main'
                }, { headers });

                statusText.innerHTML = 'ویدیو در حال ساخت است. لطفاً منتظر بمانید...';
                pollWorkflowStatus(owner, repo, token);

            } catch (error) {
                statusText.innerHTML = 'خطا: ' + (error.response?.data?.message || error.message);
            }
        }

        async function pollWorkflowStatus(owner, repo, token) {
            const headers = {
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28'
            };

            const interval = setInterval(async () => {
                try {
                    const runsRes = await axios.get(`https://api.github.com/repos/${owner}/${repo}/actions/runs?per_page=1`, { headers });
                    const run = runsRes.data.workflow_runs[0];

                    if (run) {
                        if (run.status === 'completed') {
                            clearInterval(interval);
                            if (run.conclusion === 'success') {
                                document.getElementById('progressBar').style.width = '100%';
                                document.getElementById('progressBar').innerHTML = '100%';
                                fetchDownloadLink(owner, repo, token);
                            } else {
                                document.getElementById('statusText').innerHTML = 'خطا در ساخت ویدیو توسط گیت‌هاب.';
                            }
                        } else {
                            document.getElementById('statusText').innerHTML = `وضعیت رندر: ${run.status} (${run.conclusion || 'در حال انجام'})...`;
                        }
                    }
                } catch (e) {}
            }, 5000);
        }

        async function fetchDownloadLink(owner, repo, token) {
            const headers = {
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28'
            };

            let attempts = 0;
            document.getElementById('statusBox').style.display = 'block';
            document.getElementById('progressBarContainer').style.display = 'none';
            document.getElementById('statusText').innerHTML = 'ویدیو ساخته شد. در حال مانیتورینگ برای دریافت لینک نهایی دانلود (این کار ممکن است چند ثانیه طول بکشد)...';

            const checkInterval = setInterval(async () => {
                attempts++;
                try {
                    const res = await axios.get(`https://api.github.com/repos/${owner}/${repo}/contents/final_video.mp4`, { headers });

                    clearInterval(checkInterval);
                    const downloadUrl = res.data.download_url;

                    document.getElementById('statusText').innerHTML = `
                        <b style="color: #22c55e; font-size: 16px;">ویدیو با موفقیت در گیت‌هاب ذخیره شد!</b><br><br>
                        <a href="${downloadUrl}" target="_blank" download="final_video.mp4" style="background: #0ea5e9; color: white; padding: 10px 20px; text-decoration: none; border-radius: 6px; display: inline-block; font-weight: bold;">دانلود قطعی فایل ویدیو (MP4)</a>
                    `;
                } catch (e) {
                    if (attempts >= 15) {
                        clearInterval(checkInterval);
                        document.getElementById('statusText').innerHTML = '<b style="color: #ef4444;">خطا: ویدیو ساخته شد اما فایل نهایی در مخزن یافت نشد. لطفاً دسترسی Write در فایل main.yml را بررسی کنید.</b>';
                    }
                }
            }, 3000);
        }
    </script>
</body>
</html>
